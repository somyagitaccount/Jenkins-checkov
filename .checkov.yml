# Checkov configuration file
# This file customizes Checkov scanning behavior for this Terraform project

# Framework to scan
framework:
  - terraform

# Skip checks (if needed for specific checks that don't apply to your environment)
# Example: skip-check: CKV_AWS_79  # Skip EKS endpoint public access check

# Include/exclude paths
# exclude_paths:
#   - "**/test/**"
#   - "**/examples/**"

# Include paths (if you want to scan only specific directories)
# include_paths:
#   - "modules/**"
#   - "projects/**"

# Output formats
output:
  - cli
  - junitxml
  - sarif

# Severity thresholds (optional - uncomment to use)
# soft-fail: true  # Don't fail the build on check failures
# hard-fail-on: HIGH  # Fail only on HIGH severity issues

# External checks directory (if you have custom checks)
# external-checks-dir: .checkov/custom-checks

# Skip checks that require API calls (faster scanning)
# skip-download: false

# Use BC (Bridgecrew) API for additional checks (requires API key)
# bc-api-key: ${BC_API_KEY}  # Set as Jenkins credential

# Minimum severity level to report
# min-severity: MEDIUM

# Skip specific checks (add as needed)
# skip-check:
#   - CKV_AWS_79  # Example: Skip EKS endpoint public access check

# Include/exclude specific checks
# include-check:
#   - CKV_AWS_*
# exclude-check:
#   - CKV_AWS_79

